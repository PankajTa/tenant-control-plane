[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenant-control-plane"
version = "0.1.0"
description = "Tenant provisioning control plane: REST API, transactional outbox, idempotent task-update consumer, worker simulator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0.25",
  "psycopg[binary]>=3.1.18",
  "pika>=1.3.2",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "bandit[toml]>=1.7.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["B008", "E501"] # B008: FastAPI Depends()/Query() idiom; E501: the formatter owns line length

[tool.ruff.lint.isort]
known-first-party = ["controlplane", "worker_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: needs a real RabbitMQ (TEST_AMQP_URL)"]

[tool.coverage.run]
source = ["controlplane", "worker_sim"]
branch = true

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
