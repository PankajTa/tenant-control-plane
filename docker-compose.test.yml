# Ephemeral dependencies + the dev image that runs lint / format / security / tests.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: controlplane
      POSTGRES_DB: controlplane_test
      POSTGRES_HOST_AUTH_METHOD: trust # throwaway container on a private network, no published ports
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane -d controlplane_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq-test:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: controlplane
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run `make test` to generate .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 10s
      retries: 30

  dev:
    build: { context: ., target: dev }
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://controlplane@postgres-test:5432/controlplane_test
      TEST_AMQP_URL: amqp://controlplane:${RABBITMQ_PASSWORD}@rabbitmq-test:5672/%2F
    volumes:
      # live-mount sources so `make format` rewrites your working tree
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      postgres-test: { condition: service_healthy }
      rabbitmq-test: { condition: service_healthy }
